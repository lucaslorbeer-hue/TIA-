

<!DOCTYPE html>

<html lang="de">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#050d19">

<title>TIA – Personal AI</title>

<style>

* { box-sizing: border-box; }

body {

  margin: 0;

  background: radial-gradient(circle at top,#123653,#050b14 70%);

  color: #e8f7ff;

  font-family: Arial, sans-serif;

  min-height: 100vh;

}

header {

  text-align: center;

  padding: 28px 15px;

  border-bottom: 1px solid #17618b;

}

.logo {

  width: 90px;

  height: 90px;

  margin: auto;

  border: 2px solid #4acaff;

  border-radius: 50%;

  display: grid;

  place-items: center;

  font-size: 52px;

  color: #7ce0ff;

  box-shadow: 0 0 30px #168dcc;

}

h1 {

  letter-spacing: 9px;

  color: #70d9ff;

}

.status {

  color: #48e6a0;

  font-size: 12px;

  letter-spacing: 2px;

}

main {

  max-width: 650px;

  margin: auto;

  padding: 18px;

}

.welcome {

  text-align: center;

  padding: 20px;

}

.welcome h2 {

  color: #73dfff;

  font-size: 28px;

}

#clock {

  color: #8bb8d0;

}

.chat {

  height: 42vh;

  min-height: 260px;

  overflow-y: auto;

  background: #071522;

  border: 1px solid #17618b;

  border-radius: 16px;

  padding: 14px;

}

.message {

  padding: 12px;

  margin: 10px 0;

  border-radius: 12px;

  line-height: 1.5;

  overflow-wrap: anywhere;

}

.user {

  background: #123e5d;

  margin-left: 25px;

}

.assistant {

  background: #102638;

  border: 1px solid #17618b;

  margin-right: 25px;

}

.controls {

  display: flex;

  gap: 8px;

  margin-top: 14px;

}

input {

  flex: 1;

  min-width: 0;

  padding: 14px;

  border-radius: 10px;

  border: 1px solid #2589b9;

  background: #091827;

  color: white;

  font-size: 16px;

}

button {

  background: #105078;

  color: white;

  border: 1px solid #38bfff;

  padding: 13px;

  border-radius: 10px;

  cursor: pointer;

}

.send {

  background: #0875a8;

}

.actions {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 10px;

  margin-top: 14px;

}

.actions button {

  padding: 15px 5px;

}

.footer {

  text-align: center;

  padding: 25px;

  color: #668ca5;

  font-size: 12px;

}

</style>

</head>

<body>

<header>

  <div class="logo">T</div>

  <h1>TIA</h1>

  <div class="status">● SYSTEM ONLINE</div>

  <p>PERSONAL AI ASSISTANT</p>

</header>

<main>

<section class="welcome">

  <h2>Guten Abend, Lucas</h2>

  <p>Alle Systeme laufen. TIA ist bereit.</p>

  <div id="clock"></div>

</section>

<section class="chat" id="chat">

  <div class="message assistant">

    Guten Abend, Lucas.

    TIA ist bereit.

    Was ist dein nächster Auftrag?

  </div>

</section>

<div class="controls">

  <input id="input"

    placeholder="Nachricht an TIA..."

    autocomplete="off">

  <button class="send" onclick="sendMessage()">➤</button>

</div>

<div class="actions">

  <button onclick="openChatGPT()">KI öffnen</button>

  <button onclick="startVoice()">🎤 Sprache</button>

  <button onclick="showTime()">Uhrzeit</button>

  <button onclick="clearChat()">Chat löschen</button>
 <button onclick="speakLastAnswer()">🔊 Antwort vorlesen</button>

</div>
</div>

</main>

<div class="footer">

  TIA PERSONAL ASSISTANT · VERSION 2.0

</div>

<script>

const input = document.getElementById("input");

const chat = document.getElementById("chat");

function updateClock() {

  document.getElementById("clock").textContent =

    new Date().toLocaleString("de-DE");

}

updateClock();

setInterval(updateClock, 1000);


const TIA_PERSONALITY = `

Du bist TIA, ein persönlicher KI-Assistent.

Du sprichst mit Lucas.

Deine Sprache ist Deutsch, sofern Lucas keine andere Sprache verwendet.

Dein Charakter:

- Ruhig, professionell und intelligent.

- Präzise und analytisch.

- Freundlich, aber nicht übertrieben.

- Antworten klar und verständlich.

- Bei einfachen Fragen kurz antworten.

- Bei schwierigen Fragen ausführlich erklären.

- Keine Informationen erfinden.

- Wenn du etwas nicht weißt, sagst du es offen.

Dein Stil ist von einem modernen,

futuristischen KI-Assistenten inspiriert.

`;
function addMessage(text, type) {

  const message = document.createElement("div");

  message.className = "message " + type;

  message.textContent = text;

  chat.appendChild(message);

  chat.scrollTop = chat.scrollHeight;

}

function sendMessage() {
  const input = document.getElementById("userInput");

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  input.value = "";

  addMessage(

    "Deine Nachricht ist bereit. Über die folgende Schaltfläche kannst du sie an ChatGPT übergeben.",

    "assistant"

  );

  const button = document.createElement("button");

  button.textContent = "Frage an ChatGPT übergeben";

  button.onclick = async function() {

    try {

      await navigator.clipboard.writeText(text);

      alert("Frage kopiert. Füge sie bei ChatGPT ein.");

    } catch (error) {

      alert("Bitte kopiere deine Frage manuell.");

    }

    window.open("https://chatgpt.com/", "_blank");

  };

  chat.appendChild(button);

  chat.scrollTop = chat.scrollHeight;

}

function openChatGPT() {

  window.open("https://chatgpt.com/", "_blank");

}

function showTime() {

  addMessage(

    "Die aktuelle Uhrzeit ist " +

    new Date().toLocaleTimeString("de-DE"),

    "assistant"

  );

}

function clearChat() {

  if (confirm("Chat wirklich löschen?")) {

    chat.innerHTML = "";

    addMessage("TIA ist bereit. Was ist dein Auftrag?", "assistant");

  }

}

function startVoice() {

  const Recognition =

    window.SpeechRecognition ||

    window.webkitSpeechRecognition;

  if (!Recognition) {

    addMessage(

      "Spracheingabe wird in diesem Browser nicht unterstützt.",

      "assistant"

    );

    return;

  }

  const recognition = new Recognition();

  recognition.lang = "de-DE";

  recognition.onresult = function(event) {

    input.value = event.results[0][0].transcript;

  };

  recognition.start();

}


function speakLastAnswer() {

  const answers = chat.querySelectorAll(".message.assistant");

  const last = answers[answers.length - 1];

  if (!last) {

    alert("Es gibt noch keine Antwort zum Vorlesen.");

    return;

  }

  if (!("speechSynthesis" in window)) {

    alert("Die Sprachausgabe wird nicht unterstützt.");

    return;

  }

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(last.textContent);

  utterance.lang = "de-DE";

  utterance.rate = 0.82;

  utterance.pitch = 0.75;
utterance.volume = 1;
  window.speechSynthesis.speak(utterance);

}
input.addEventListener("keydown", function(event) {

  if (event.key === "Enter") sendMessage();

});

</script>

</body>

</html>
